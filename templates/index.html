<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendario - PADEL</title>
    <!-- FullCalendar: usar archivos locales descargados en static/vendor/fullcalendar -->
    <link href="/static/vendor/fullcalendar/main.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body>
    <div class="app-wrap">
      <div class="container">
        <div class="topbar">
          <div class="brand">
            <div class="brand-logo">PD</div>
            <div>
              <div class="brand-title">PADEL Manager</div>
              <div class="subtle">Calendario de partidos y estadísticas</div>
            </div>
          </div>
          <div>
            <button id="new-event-btn" class="btn" onclick="openCreateEvent()">Registrar evento</button>
            <a class="btn" href="/players">Jugadores</a>
            <a class="btn secondary" href="/stats">Estadísticas</a>
          </div>
        </div>

        <div class="dashboard" style="display:flex; gap:18px; align-items:flex-start;">
          <div class="dash-left" style="width:320px;">
            <div class="card" style="padding:12px; border-radius:8px; background:rgba(255,255,255,0.02);">
              <h3 style="margin:0 0 8px 0">Top jugadores</h3>
              <ul id="mini-list" style="list-style:none; padding:0; margin:0 0 8px 0; color:var(--white)"></ul>
              <canvas id="mini-chart" style="width:100%; height:160px"></canvas>
            </div>
          </div>
          <div class="dash-right" style="flex:1;">
            <div id="calendar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal simple para crear/editar eventos -->
    <div id="event-modal" class="modal" style="display:none;">
      <div class="modal-content">
        <span id="modal-close" class="modal-close">&times;</span>
        <h2 id="modal-title">Evento</h2>
        <form id="event-form">
          <div id="evt-error" style="color:#b00020; margin-bottom:8px; display:none;"></div>
          <label>Título<br><input type="text" id="evt-title" required></label><br>
          <label>Fecha inicio<br><input type="date" id="evt-start" required></label><br>
          <label>Jugador 1 (Pareja A)<br><select id="p1"></select></label><br>
          <label>Jugador 2 (Pareja A)<br><select id="p2"></select></label><br>
          <label>Jugador 3 (Pareja B)<br><select id="p3"></select></label><br>
          <label>Jugador 4 (Pareja B)<br><select id="p4"></select></label><br>
          <div style="margin-top:8px">
            <button type="submit" id="save-btn">Guardar</button>
            <button type="button" id="delete-btn" style="margin-left:8px; display:none;">Eliminar</button>
          </div>
        </form>

        <div id="result-section" style="margin-top:12px; display:none;">
          <h3>Registrar resultado</h3>
          <label>Marcador (ej: 6-3 4-6 6-4)<br><input type="text" id="evt-score"></label><br>
          <label>Ganador<br>
            <select id="evt-winner">
              <option value="1">Pareja A (p1+p2)</option>
              <option value="2">Pareja B (p3+p4)</option>
            </select>
          </label><br>
          <button id="save-result-btn">Guardar resultado</button>
        </div>
      </div>
    </div>

    <!-- FullCalendar JS local -->
    <script src="/static/vendor/fullcalendar/index.global.min.js"></script>
    <!-- Chart.js local (para dashboard/estadísticas) -->
    <script src="/static/vendor/chartjs/chart.umd.min.js"></script>
    <script>
      // Fallback dinámico: si los archivos locales no existen (404), cargar desde CDN
      (function(){
        function loadCss(href){
          var l = document.createElement('link'); l.rel='stylesheet'; l.href=href; document.head.appendChild(l);
        }
        function loadScript(src){
          var s=document.createElement('script'); s.src=src; document.head.appendChild(s);
        }
        // Si FullCalendar no está definido tras intentar cargar el local, inyectar CDN
        setTimeout(function(){
          if (typeof FullCalendar === 'undefined') {
            console.warn('[PADEL] FullCalendar local no encontrado, cargando desde CDN')
            loadCss('https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css')
            loadScript('https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js')
          }
          if (typeof Chart === 'undefined') {
            console.warn('[PADEL] Chart.js local no encontrado, cargando desde CDN')
            loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js')
          }
        }, 200);
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/dashboard.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligas - Padel Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/svg+xml">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --accent: #d4f135; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { width: 100%; background: var(--text); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .league-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f1f5f9; }
        
        .action-btn { background: #f1f5f9; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-left: 5px; }
        .action-btn:hover { background: #e2e8f0; }
        .btn-del { color: #ef4444; border-color: #fecaca; background: #fef2f2; }

        /* Modal Players */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; backdrop-filter:blur(2px); z-index: 100; }
        .modal { background:white; padding:20px; border-radius:12px; width:90%; max-width:600px; height: 80vh; display: flex; flex-direction: column; }
        .dual-list { display: flex; gap: 10px; flex: 1; overflow: hidden; margin-top: 10px; }
        .list-box { flex: 1; border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; background: #f8fafc; }
        .list-header { padding: 10px; font-weight: 700; text-align: center; background: #fff; border-bottom: 1px solid var(--border); }
        .list-content { flex: 1; overflow-y: auto; padding: 5px; }
        .player-item { padding: 8px; background: white; margin-bottom: 5px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .player-item:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin:0">🏆 Mis Ligas</h2>
            <a href="/" style="text-decoration:none; color:var(--text); font-weight:600;">← Volver</a>
        </div>

        <div class="card">
            <label style="font-weight:600; display:block; margin-bottom:8px;">Crear Nueva Liga</label>
            <input type="text" id="league-name" class="form-control" placeholder="Ej: Liga Verano 2026">
            <button class="btn" style="background:var(--accent); color:black;" onclick="createLeague()">Añadir Liga</button>
        </div>

        <div class="card" id="leagues-list" style="padding:0;"></div>
    </div>

    <div id="modal-players" class="modal-overlay">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0" id="modal-title">Gestionar Jugadores</h3>
                <span onclick="closeModal()" style="cursor:pointer; font-size:1.5rem">&times;</span>
            </div>
            <div style="font-size:0.8rem; color:#64748b; margin-bottom:10px;">Haz clic en los jugadores para moverlos de lista.</div>
            
            <div class="dual-list">
                <div class="list-box">
                    <div class="list-header">Disponibles</div>
                    <div class="list-content" id="list-available"></div>
                </div>
                <div class="list-box">
                    <div class="list-header" style="color:green">En la Liga</div>
                    <div class="list-content" id="list-in"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLeagueId = null;

        async function loadLeagues() {
            const res = await fetch('/api/leagues');
            const data = await res.json();
            document.getElementById('leagues-list').innerHTML = data.map(l => `
                <div class="league-item">
                    <div>
                        <div style="font-weight:600;">${l.name}</div>
                        <div style="font-size:0.75rem; color:#94a3b8;">${l.created_at}</div>
                    </div>
                    <div>
                        <button class="action-btn" onclick="openManager(${l.id}, '${l.name}')"><i class="fas fa-users"></i> Jugadores</button>
                        <button class="action-btn btn-del" onclick="deleteLeague(${l.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function createLeague() {
            const name = document.getElementById('league-name').value;
            if(!name) return;
            await fetch('/api/leagues', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
            document.getElementById('league-name').value = '';
            loadLeagues();
        }

        async function deleteLeague(id) {
            const res = await Swal.fire({ title: '¿Borrar liga?', text: 'Se borrarán partidos y configuraciones.', icon: 'warning', showCancelButton: true, confirmButtonColor:'#ef4444' });
            if(res.isConfirmed) {
                await fetch(`/api/leagues?id=${id}`, {method:'DELETE'});
                loadLeagues();
            }
        }

        // --- GESTIÓN DE JUGADORES ---
        async function openManager(lid, name) {
            currentLeagueId = lid;
            document.getElementById('modal-title').innerText = `Jugadores: ${name}`;
            document.getElementById('modal-players').style.display = 'flex';
            loadLeaguePlayers();
        }

        function closeModal() { document.getElementById('modal-players').style.display = 'none'; }

        async function loadLeaguePlayers() {
            const res = await fetch(`/api/leagues/${currentLeagueId}/players`);
            const players = await res.json();
            
            const available = players.filter(p => !p.in_league);
            const inLeague = players.filter(p => p.in_league);

            document.getElementById('list-available').innerHTML = available.map(p => `
                <div class="player-item" onclick="togglePlayer(${p.id}, 'add')">
                    ${p.name} <i class="fas fa-plus" style="color:#cbd5e1"></i>
                </div>
            `).join('');

            document.getElementById('list-in').innerHTML = inLeague.map(p => `
                <div class="player-item" onclick="togglePlayer(${p.id}, 'remove')" style="border-left:3px solid var(--accent)">
                    ${p.name} <i class="fas fa-times" style="color:var(--danger)"></i>
                </div>
            `).join('');
        }

        async function togglePlayer(pid, action) {
            if(action === 'add') {
                await fetch(`/api/leagues/${currentLeagueId}/players`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({player_id: pid})});
            } else {
                await fetch(`/api/leagues/${currentLeagueId}/players?player_id=${pid}`, {method:'DELETE'});
            }
            loadLeaguePlayers(); // Recargar listas
        }

        loadLeagues();
    </script>
</body>
</html>

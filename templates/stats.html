<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Estadísticas - Padel Manager</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    /* Estilos específicos para el Simulador */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--bg-dark);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Simulador VS */
    .vs-container {
      text-align: center;
      margin-top: 10px;
    }
    .vs-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .vs-circle {
      width: 40px; height: 40px;
      background: var(--ball);
      color: var(--bg-dark);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    
    /* Barra de predicción */
    .prediction-bar-bg {
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin: 20px 0 10px;
      display: flex;
    }
    .pred-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      transition: width 0.5s ease;
    }
    .pred-left { background: #3b82f6; color: white; width: 50%; } /* Azul standard */
    .pred-right { background: var(--ball); color: var(--bg-dark); width: 50%; } /* Amarillo fluor */

    .big-percent {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 10px 0;
    }
    .winner-highlight { color: var(--ball); text-shadow: 0 0 10px rgba(223, 255, 0, 0.3); }
    .loser-highlight { color: #fff; opacity: 0.5; }

  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="container">
      
      <div class="topbar">
        <div class="brand">
          <div class="brand-logo">PM</div>
          <div class="brand-title">ESTADÍSTICAS</div>
        </div>
        <a class="btn secondary" href="/">Volver</a>
      </div>

      <div class="stats-grid">
        
        <div class="card">
          <h2 style="margin-top:0; color:var(--ball); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
            🔮 El Oráculo
          </h2>
          <p class="subtle" style="margin-bottom:20px">Selecciona dos jugadores para predecir el ganador basado en su historial.</p>
          
          <div class="vs-inputs">
            <div style="flex:1">
              <select id="pA" onchange="calculatePrediction()">
                <option value="">Jugador A</option>
              </select>
            </div>
            <div class="vs-circle">VS</div>
            <div style="flex:1">
              <select id="pB" onchange="calculatePrediction()">
                <option value="">Jugador B</option>
              </select>
            </div>
          </div>

          <div id="prediction-result" style="display:none; text-align:center;">
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
              <div id="nameA" style="font-weight:bold; font-size:1.1rem"></div>
              <div id="nameB" style="font-weight:bold; font-size:1.1rem"></div>
            </div>

            <div class="prediction-bar-bg">
              <div id="barA" class="pred-segment pred-left">50%</div>
              <div id="barB" class="pred-segment pred-right">50%</div>
            </div>

            <div style="display:flex; justify-content:space-between;">
              <div id="probA" class="subtle">Probabilidad</div>
              <div id="probB" class="subtle">Probabilidad</div>
            </div>

            <div style="margin-top:15px; font-size:0.9rem; color:#aaa; font-style:italic;">
              * Basado en el % de victorias global de cada uno.
            </div>
          </div>
          
          <div id="empty-state" style="text-align:center; padding:30px; color:#666;">
            Selecciona ambos jugadores para ver la predicción.
          </div>
        </div>

        <div class="card">
          <h2 style="margin-top:0; color:white; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
            🏆 Ranking Global
          </h2>
          <table class="players-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>V/D</th>
                <th>% Vic</th>
              </tr>
            </thead>
            <tbody id="stats-body">
              </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    let playersData = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadStats();
    });

    function loadStats() {
      fetch('/api/stats')
        .then(r => r.json())
        .then(data => {
          playersData = data;
          renderTable(data);
          populateSelects(data);
        });
    }

    // 1. Renderizar Tabla
    function renderTable(data) {
      const tbody = document.getElementById('stats-body');
      tbody.innerHTML = '';
      data.forEach((p, index) => {
        // Medalla para el top 3
        let rank = `#${index + 1}`;
        if (index === 0) rank = '🥇';
        if (index === 1) rank = '🥈';
        if (index === 2) rank = '🥉';

        // Color condicional para el %
        let color = '#fff';
        if(p.win_rate >= 60) color = 'var(--ball)'; // Alto
        else if(p.win_rate < 40) color = '#ff4d4d'; // Bajo

        tbody.innerHTML += `
          <tr>
            <td style="font-weight:bold">${rank}</td>
            <td>${p.first_name} ${p.last_name || ''}</td>
            <td><span style="color:var(--ball)">${p.wins}</span> / <span style="color:#ff4d4d">${p.losses}</span></td>
            <td style="color:${color}; font-weight:bold">${p.win_rate}%</td>
          </tr>
        `;
      });
    }

    // 2. Llenar Selectores del Simulador
    function populateSelects(data) {
      const pA = document.getElementById('pA');
      const pB = document.getElementById('pB');
      
      // Ordenar alfabéticamente para buscar fácil
      const sorted = [...data].sort((a,b) => a.first_name.localeCompare(b.first_name));

      sorted.forEach(p => {
        const opt = `<option value="${p.id}" data-rate="${p.win_rate}" data-name="${p.first_name}">${p.first_name} ${p.last_name||''} (${p.win_rate}%)</option>`;
        pA.innerHTML += opt;
        pB.innerHTML += opt;
      });
    }

    // 3. Lógica del "Oráculo"
    function calculatePrediction() {
      const selA = document.getElementById('pA');
      const selB = document.getElementById('pB');
      const idA = selA.value;
      const idB = selB.value;

      const uiResult = document.getElementById('prediction-result');
      const uiEmpty = document.getElementById('empty-state');

      if (!idA || !idB || idA === idB) {
        uiResult.style.display = 'none';
        uiEmpty.style.display = 'block';
        if(idA && idB && idA === idB) uiEmpty.innerText = "¡Un jugador no puede jugar contra sí mismo!";
        return;
      }

      uiEmpty.style.display = 'none';
      uiResult.style.display = 'block';

      // Obtener datos (usamos dataset del option seleccionado)
      const optA = selA.options[selA.selectedIndex];
      const optB = selB.options[selB.selectedIndex];

      const rateA = parseFloat(optA.getAttribute('data-rate')) || 0;
      const rateB = parseFloat(optB.getAttribute('data-rate')) || 0;
      const nameA = optA.getAttribute('data-name');
      const nameB = optB.getAttribute('data-name');

      // Algoritmo simple de probabilidad ponderada
      // Si ambos tienen 0 partidos, es 50/50.
      let chanceA = 50;
      let chanceB = 50;

      const totalPower = rateA + rateB;

      if (totalPower > 0) {
        chanceA = (rateA / totalPower) * 100;
        chanceB = (rateB / totalPower) * 100;
      } else {
        // Si ambos son 0%, asumimos empate técnico
        chanceA = 50;
        chanceB = 50;
      }

      // Actualizar UI
      document.getElementById('nameA').innerText = nameA;
      document.getElementById('nameB').innerText = nameB;

      // Barra
      const barA = document.getElementById('barA');
      const barB = document.getElementById('barB');
      
      barA.style.width = `${chanceA}%`;
      barB.style.width = `${chanceB}%`;
      
      barA.innerText = `${Math.round(chanceA)}%`;
      barB.innerText = `${Math.round(chanceB)}%`;

      // Resaltar al ganador probable
      if (chanceA > chanceB) {
        document.getElementById('nameA').className = "winner-highlight big-percent";
        document.getElementById('nameB').className = "loser-highlight";
      } else if (chanceB > chanceA) {
        document.getElementById('nameB').className = "winner-highlight big-percent";
        document.getElementById('nameA').className = "loser-highlight";
      } else {
        document.getElementById('nameA').className = "";
        document.getElementById('nameB').className = "";
      }
    }
  </script>
</body>
</html>

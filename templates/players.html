<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Jugadores - Padel Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
      .sort-controls { margin-bottom: 15px; display:flex; gap:10px; align-items:center; }
      .sort-label { font-size: 0.9rem; color: #aaa; }
      .edit-btn { background: #3b82f6; color:white; padding:4px 8px; font-size:0.8rem; border-radius:4px; border:0; cursor:pointer; margin-right:5px;}
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <div class="brand-logo">PM</div>
          <div class="brand-title">JUGADORES</div>
        </div>
        <a class="btn secondary" href="/">Volver</a>
      </div>

      <div style="background:rgba(0,0,0,0.2); padding:15px; border-radius:8px; margin-bottom:20px;">
        <h3>Nuevo Jugador</h3>
        <form id="player-form" style="display:flex; gap:10px; align-items:end; flex-wrap:wrap">
          <div style="flex:1; min-width:150px"><label>Nombre</label><input id="first_name" required></div>
          <div style="flex:1; min-width:150px"><label>Apellido</label><input id="last_name"></div>
          <button class="btn" type="submit">Agregar</button>
        </form>
      </div>
      
      <div class="sort-controls">
          <span class="sort-label">Ordenar por:</span>
          <button class="btn secondary" onclick="sortPlayers('name')">Nombre (A-Z)</button>
          <button class="btn secondary" onclick="sortPlayers('id')">ID (Recientes)</button>
      </div>

      <table class="players-table" id="players-table">
        <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>ELO</th><th>Acciones</th></tr></thead>
        <tbody id="players-body"></tbody>
      </table>
    </div>
  </div>

  <div id="edit-modal" class="modal" style="display:none">
      <div class="modal-content">
          <span class="modal-close" onclick="closeEditModal()">&times;</span>
          <h2>Editar Jugador</h2>
          <form id="edit-form">
              <input type="hidden" id="edit-id">
              <label>Nombre</label><input id="edit-first" required>
              <label>Apellido</label><input id="edit-last">
              <label>ELO</label><input type="number" id="edit-elo" required>
              <button type="submit" class="btn" style="width:100%; margin-top:10px">Guardar Cambios</button>
          </form>
      </div>
  </div>

  <script>
    let playersCache = [];

    document.addEventListener('DOMContentLoaded', loadPlayers);

    function loadPlayers() {
      fetch('/api/players').then(r=>r.json()).then(data => {
        playersCache = data;
        renderTable(playersCache);
      });
    }

    function renderTable(data) {
        const tbody = document.getElementById('players-body');
        tbody.innerHTML = '';
        data.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.first_name}</td>
                    <td>${p.last_name || ''}</td>
                    <td><span style="color:var(--ball); font-weight:bold">${p.elo}</span></td>
                    <td>
                        <button class="edit-btn" onclick='openEdit(${JSON.stringify(p)})'>Editar</button>
                        <button class="btn danger" style="padding:4px 8px; font-size:0.8rem" onclick="delPlayer(${p.id})">X</button>
                    </td>
                </tr>
            `;
        });
    }

    // Ordenar
    window.sortPlayers = function(criteria) {
        let sorted = [...playersCache];
        if(criteria === 'name') {
            sorted.sort((a,b) => a.first_name.localeCompare(b.first_name));
        } else if(criteria === 'id') {
            sorted.sort((a,b) => b.id - a.id);
        }
        renderTable(sorted);
    }

    // Crear
    document.getElementById('player-form').onsubmit = (e) => {
        e.preventDefault();
        const first = document.getElementById('first_name').value;
        const last = document.getElementById('last_name').value;
        fetch('/api/players', { method:'POST', body:JSON.stringify({first_name:first, last_name:last}), headers:{'Content-Type':'application/json'} })
        .then(() => { document.getElementById('player-form').reset(); loadPlayers(); });
    };

    // Borrar
    window.delPlayer = (id) => {
        if(confirm('¿Borrar jugador?')) fetch(`/api/players/${id}`, {method:'DELETE'}).then(loadPlayers);
    };

    // Editar
    const editModal = document.getElementById('edit-modal');
    window.openEdit = function(p) {
        document.getElementById('edit-id').value = p.id;
        document.getElementById('edit-first').value = p.first_name;
        document.getElementById('edit-last').value = p.last_name || '';
        document.getElementById('edit-elo').value = p.elo;
        editModal.style.display = 'block';
    }
    window.closeEditModal = function() { editModal.style.display = 'none'; }
    
    document.getElementById('edit-form').onsubmit = (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-id').value;
        const payload = {
            first_name: document.getElementById('edit-first').value,
            last_name: document.getElementById('edit-last').value,
            elo: document.getElementById('edit-elo').value
        };
        fetch(`/api/players/${id}`, { method:'PUT', body:JSON.stringify(payload), headers:{'Content-Type':'application/json'} })
        .then(() => { closeEditModal(); loadPlayers(); });
    };
  </script>
</body>
</html>
